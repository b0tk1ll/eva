<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Links</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{

background:linear-gradient(135deg,#ff5ea8,#7d5fff,#2d98da);

background-size:300% 300%;

animation:bg 10s infinite alternate;

display:flex;

justify-content:center;

align-items:center;

height:100vh;

}

@keyframes bg{

0%{background-position:left;}

100%{background-position:right;}

}

.card{

background:rgba(255,255,255,.15);

backdrop-filter:blur(20px);

padding:35px;

border-radius:25px;

width:360px;

text-align:center;

color:white;

box-shadow:0 20px 40px rgba(0,0,0,.3);

}

img{

width:130px;

height:130px;

border-radius:50%;

object-fit:cover;

border:4px solid white;

margin-bottom:20px;

}

h1{

font-size:32px;

margin-bottom:10px;

}

p{

opacity:.9;

margin-bottom:25px;

}

a{

display:block;

padding:15px;

margin:12px 0;

text-decoration:none;

background:white;

color:#333;

font-weight:bold;

border-radius:14px;

transition:.3s;

}

a:hover{

transform:scale(1.04);

}

</style>

</head>

<body>

<div class="card">

<img src="avatar.jpg">

<h1>Anna</h1>

<p>Official Creator</p>

<a href="https://onlyfans.com/wondereva/c195">❤️ Subscribe</a>



</div>

</body>

</html>
